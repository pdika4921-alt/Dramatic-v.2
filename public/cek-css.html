<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cek Versi CSS Admin</title>
<style>
  body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 40px; }
  .kartu { max-width: 760px; margin: auto; background: #1e293b; border-radius: 16px; padding: 32px; }
  h1 { font-size: 16px; margin-top: 0; }
  #hasil { font-size: 26px; font-weight: 600; padding: 24px; border-radius: 12px; text-align: center; margin: 24px 0; }
  .baru { background: #14532d; color: #86efac; }
  .lama { background: #7f1d1d; color: #fecaca; }
  pre { background: #0f172a; padding: 12px; border-radius: 8px; font-size: 10px; white-space: pre-wrap; word-break: break-all; }
  .langkah { background: #334155; padding: 16px 20px; border-radius: 10px; line-height: 1.7; font-size: 12px; }
  .langkah b { color: #fbbf24; }
</style>
</head>
<body>
<div class="kartu">
  <h1>Cek Versi CSS Admin (localhost:3000)</h1>
  <div id="hasil">Memeriksa…</div>
  <div id="detail"></div>
  <div id="langkah" class="langkah" style="display:none"></div>
</div>
<script>
(async () => {
  const MARKER = '140% 82% at 35% 108%';
  const MARKER_LAMA = ['160% 42% at -14% 104%', 'width: 272px'];
  let teks = '', via = '';
  try {
    const r = await fetch('/admin.html', { cache: 'no-store' });
    teks = await r.text();
    via = 'HTTP ' + r.status;
  } catch (e) {
    document.getElementById('hasil').className = 'lama';
    document.getElementById('hasil').textContent = 'GAGAL mengambil admin.html: ' + e.message;
    return;
  }
  const adaBaru = teks.includes(MARKER);
  const lamaKetemu = MARKER_LAMA.filter(m => teks.includes(m));
  const h = document.getElementById('hasil');
  const d = document.getElementById('detail');
  if (adaBaru) {
    h.className = 'baru';
    h.textContent = '✅ VERSI BARU — gelombang oranye terbaru';
    d.innerHTML = '<p>Sumber: ' + via + '. Jika tampilan dashboard Anda BELUM ada gelombang oranye melengkung di sidebar, berarti tab dashboard-nya masih menampilkan halaman lama — tutup semua tab localhost:3000 lalu buka ulang <code>http://localhost:3000/admin.html</code>.</p>';
  } else {
    h.className = 'lama';
    h.textContent = '❌ VERSI LAMA yang dimuat browser';
    d.innerHTML = '<p>Sumber: ' + via + (lamaKetemu.length ? '. Terdeteksi penanda lama: <code>' + lamaKetemu.join(', ') + '</code>' : '') + '</p>';
    const l = document.getElementById('langkah');
    l.style.display = 'block';
    l.innerHTML = '<b>Jalankan pembersih sekarang:</b><br>1. Buka <a style="color:#93c5fd" href="/sw-cleanup.html">http://localhost:3000/sw-cleanup.html</a> dan tunggu sampai selesai.<br>2. Tutup semua tab localhost:3000.<br>3. Buka kembali <a style="color:#93c5fd" href="/admin.html">http://localhost:3000/admin.html</a>.<br>4. Muat ulang halaman <b>Cek Versi CSS</b> ini lagi untuk memastikan.';
  }
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    d.innerHTML += '<p><b>Service worker aktif di origin ini:</b> ' + (regs.length ? regs.map(r => (r.scope || '?')).join('<br>') : 'TIDAK ADA (bersih)') + '</p>';
    const keys = await caches.keys();
    d.innerHTML += '<p><b>CacheStorage:</b> ' + (keys.length ? keys.join(', ') : 'kosong') + '</p>';
  } catch (e) {}
})();
</script>
</body>
</html>
