<script>
(function () {
  if (window.__ppEvidenReady) return;
  window.__ppEvidenReady = true;

  var KATEGORI = ['Foto Progres', 'Foto Material', 'Foto Instalasi', 'Dokumen PDF', 'Lainnya'];
  var FORMAT_OK = ['jpg', 'jpeg', 'png', 'webp', 'pdf'];

  var overlay, form, alertBox, submitBtn, submitText, spin;
  var lokasiInput, lokasiOpts, kategoriSel, drop, fileInput, listWrap;
  var daftarLokasi = [];
  var lokasiTerpilih = null;
  var daftarFile = [];
  var lastFocus = null;

  /* ── NOTIFIKASI ── */
  function showAlert(msg, type) {
    alertBox.className = 'ev-alert ' + (type || 'err');
    alertBox.textContent = msg;
    alertBox.hidden = false;
  }
  function hideAlert() { alertBox.hidden = true; alertBox.textContent = ''; }

  function toast(msg, type) {
    var old = document.querySelector('.ev-toast');
    if (old) old.remove();
    var t = document.createElement('div');
    t.className = 'pp-toast ev-toast ' + (type || '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 3200);
  }

  function markBad(el, bad) { if (el) el.classList.toggle('bad', !!bad); }

  /* ── COMBOBOX LOKASI ── */
  function renderOpsiLokasi(q) {
    var kata = (q || '').trim().toLowerCase();
    var cocok = daftarLokasi.filter(function (l) { return !kata || String(l.nama_lokasi).toLowerCase().indexOf(kata) > -1; });
    lokasiOpts.innerHTML = cocok.length
      ? cocok.map(function (l) {
          return '<li class="ev-opt" role="option" data-id="' + l.id + '">' + String(l.nama_lokasi).replace(/[&<>"]/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
          }) + '</li>';
        }).join('')
      : '<li class="ev-opt-empty">Lokasi tidak ditemukan</li>';
    lokasiOpts.hidden = false;
    lokasiInput.setAttribute('aria-expanded', 'true');
    tandaiHot(0);
  }

  function tutupOpsi() {
    lokasiOpts.hidden = true;
    lokasiInput.setAttribute('aria-expanded', 'false');
  }

  function opsinya() { return Array.prototype.slice.call(lokasiOpts.querySelectorAll('.ev-opt')); }

  function tandaiHot(i) {
    var ops = opsinya();
    ops.forEach(function (li, k) { li.classList.toggle('ev-hot', k === i); });
    if (ops[i] && ops[i].scrollIntoView) ops[i].scrollIntoView({ block: 'nearest' });
  }

  function pilihLokasi(li) {
    lokasiTerpilih = { id: Number(li.dataset.id), nama: li.textContent };
    lokasiInput.value = lokasiTerpilih.nama;
    markBad(lokasiInput, false);
    tutupOpsi();

    if (kategoriSel.disabled) {
      kategoriSel.innerHTML = '<option value="">— Pilih kategori berkas —</option>' +
        KATEGORI.map(function (k) { return '<option value="' + k + '">' + k + '</option>'; }).join('');
      kategoriSel.disabled = false;
    }
  }

  async function muatLokasi() {
    if (daftarLokasi.length) return;
    try {
      var res = await fetch('/api/project-plan/lokasi');
      var json = await res.json().catch(function () { return null; });
      daftarLokasi = (json && json.data) || [];
      if (!daftarLokasi.length) {
        lokasiInput.placeholder = 'Belum ada project plan — buat dulu di form Input Project Plan';
      }
    } catch (e) {
      lokasiInput.placeholder = 'Gagal memuat daftar lokasi';
    }
  }

  function pasangComboLokasi() {
    lokasiInput.addEventListener('focus', function () { muatLokasi().then(function () { renderOpsiLokasi(lokasiInput.value); }); });
    lokasiInput.addEventListener('input', function () {
      lokasiTerpilih = null;
      markBad(lokasiInput, false);
      muatLokasi().then(function () { renderOpsiLokasi(lokasiInput.value); });
    });
    lokasiInput.addEventListener('blur', tutupOpsi);
    lokasiInput.addEventListener('keydown', function (e) {
      if (lokasiOpts.hidden) return;
      var ops = opsinya();
      var idx = -1;
      ops.forEach(function (li, k) { if (li.classList.contains('ev-hot')) idx = k; });
      if (e.key === 'ArrowDown') { e.preventDefault(); tandaiHot(Math.min(idx + 1, ops.length - 1)); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); tandaiHot(Math.max(idx - 1, 0)); }
      else if (e.key === 'Enter') {
        if (ops.length) { e.preventDefault(); pilihLokasi(ops[idx < 0 ? 0 : idx]); }
      } else if (e.key === 'Escape') {
        e.preventDefault(); e.stopPropagation(); tutupOpsi();
      }
    });
    lokasiOpts.addEventListener('mousedown', function (e) {
      var li = e.target.closest ? e.target.closest('.ev-opt') : null;
      if (!li) return;
      e.preventDefault();
      pilihLokasi(li);
    });
  }

  /* ── DAFTAR FILE + PREVIEW ── */
  function ukuran(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / (1024 * 1024)).toFixed(1) + ' MB';
  }

  function renderFile() {
    listWrap.innerHTML = '';
    daftarFile.forEach(function (item, i) {
      var ext = (item.file.name.split('.').pop() || '').toLowerCase();
      var isImg = ['jpg', 'jpeg', 'png', 'webp'].indexOf(ext) > -1;
      var row = document.createElement('div');
      row.className = 'ev-file';
      row.innerHTML =
        '<div class="ev-thumb">' + (isImg ? '<img alt="">' : ext.toUpperCase()) + '</div>' +
        '<div class="ev-meta">' +
          '<div class="ev-name"></div>' +
          '<div class="ev-size"></div>' +
          '<div class="ev-ket"><input class="ev-in" data-ket type="text" placeholder="Keterangan (opsional)" autocomplete="off"></div>' +
        '</div>' +
        '<button type="button" class="ev-rm" title="Hapus file" aria-label="Hapus file">&#10005;</button>';
      row.querySelector('.ev-name').textContent = item.file.name;
      row.querySelector('.ev-size').textContent = ukuran(item.file.size);
      if (isImg) row.querySelector('img').src = item.url;
      row.querySelector('[data-ket]').addEventListener('input', function (e) { item.ket = e.target.value; });
      row.querySelector('.ev-rm').addEventListener('click', function () {
        URL.revokeObjectURL(item.url);
        daftarFile.splice(i, 1);
        renderFile();
      });
      listWrap.appendChild(row);
    });
  }

  function tambahFile(fileList) {
    Array.prototype.slice.call(fileList).forEach(function (f) {
      var ext = (f.name.split('.').pop() || '').toLowerCase();
      if (FORMAT_OK.indexOf(ext) < 0) {
        toast('"' + f.name + '" dilewati: format harus JPG, PNG, WEBP, atau PDF.', 'err');
        return;
      }
      daftarFile.push({ file: f, ket: '', url: URL.createObjectURL(f) });
    });
    renderFile();
  }

  function pasangDropzone() {
    drop.addEventListener('click', function (e) {
      if (e.target === fileInput) return; // cegah rekursi dari .click() programatik
      fileInput.click();
    });
    drop.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener('change', function () {
      tambahFile(fileInput.files);
      fileInput.value = '';
    });
    ['dragenter', 'dragover'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
    });
    drop.addEventListener('drop', function (e) {
      if (e.dataTransfer && e.dataTransfer.files) tambahFile(e.dataTransfer.files);
    });
  }

  /* ── KONTROL MODAL ── */
  function setLoading(on) {
    submitBtn.disabled = on;
    spin.hidden = !on;
    submitSubmitText(on ? 'Mengunggah...' : 'Upload');
  }
  function submitSubmitText(t) { submitText.textContent = t; }

  function resetForm() {
    form.reset();
    lokasiTerpilih = null;
    daftarFile.forEach(function (i) { URL.revokeObjectURL(i.url); });
    daftarFile = [];
    renderFile();
    lokasiInput.value = '';
    markBad(lokasiInput, false);
    kategoriSel.innerHTML = '<option value="">— Pilih lokasi terlebih dahulu —</option>';
    kategoriSel.disabled = true;
    tutupOpsi();
    hideAlert();
  }

  async function submit(e) {
    e.preventDefault();
    hideAlert();

    if (!lokasiTerpilih) {
      markBad(lokasiInput, true);
      showAlert('Lokasi kerja wajib dipilih terlebih dahulu.');
      return;
    }
    if (!kategoriSel.value) {
      markBad(kategoriSel, true);
      showAlert('Kategori berkas wajib dipilih.');
      return;
    }
    if (!daftarFile.length) {
      showAlert('Pilih minimal 1 file eviden.');
      return;
    }

    var fd = new FormData();
    fd.append('project_id', String(lokasiTerpilih.id));
    fd.append('kategori', kategoriSel.value);
    daftarFile.forEach(function (item) {
      fd.append('files', item.file, item.file.name);
      fd.append('keterangan', item.ket || '');
    });

    setLoading(true);
    try {
      var res = await fetch('/api/project-plan/eviden', { method: 'POST', body: fd });
      var json = null;
      try { json = await res.json(); } catch (err) { /* respons bukan JSON */ }
      if (!res.ok || !json || json.success !== true) {
        throw new Error((json && json.message) || ('Server merespons ' + res.status));
      }
      toast('Eviden berhasil diupload.', 'ok');
      resetForm();
      setTimeout(close, 700);
    } catch (err) {
      showAlert(err.message || 'Gagal mengunggah eviden. Periksa koneksi lalu coba lagi.');
      toast('Gagal mengunggah eviden.', 'err');
    } finally {
      setLoading(false);
    }
  }

  function onKeydown(e) {
    if (e.key === 'Escape' && !overlay.hidden) close();
  }

  function open() {
    lastFocus = document.activeElement;
    overlay.hidden = false;
    document.body.style.overflow = 'hidden';
    muatLokasi();
    setTimeout(function () { lokasiInput.focus(); }, 40);
  }

  function close() {
    overlay.hidden = true;
    document.body.style.overflow = '';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  function init() {
    overlay = document.getElementById('evOverlay');
    form = document.getElementById('evForm');
    alertBox = document.getElementById('evAlert');
    submitBtn = document.getElementById('evSubmit');
    submitText = document.getElementById('evSubmitText');
    spin = document.getElementById('evSpin');
    lokasiInput = document.getElementById('evLokasi');
    lokasiOpts = document.getElementById('evLokasiOpts');
    kategoriSel = document.getElementById('evKategori');
    drop = document.getElementById('evDrop');
    fileInput = document.getElementById('evFile');
    listWrap = document.getElementById('evList');

    renderFile();
    pasangComboLokasi();
    pasangDropzone();

    form.addEventListener('submit', submit);
    form.addEventListener('input', function (e) {
      if (e.target.classList && e.target.classList.contains('bad')) markBad(e.target, false);
    });
    kategoriSel.addEventListener('change', function () { markBad(kategoriSel, false); });
    overlay.querySelectorAll('[data-ev-close]').forEach(function (btn) {
      btn.addEventListener('click', close);
    });
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) close(); });
    document.addEventListener('keydown', onKeydown);

    window.openEvidenModal = open;
    window.closeEvidenModal = close;
    window.EvidenModal = { open: open, close: close };
  }

  init();
})();
</script>
